<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048" role="img" aria-labelledby="title desc">
<title id="title">simulator-manager — Dynamic Simulator Pool and Traditional Mode</title>
<desc id="desc">Build and host tests first. FIFO admission grants a private session simulator by default. Sustained host pressure progresses through constrained and draining stages to Traditional Mode. Creation, boot and work share a total time budget. Waiting sessions cause safe checkpoint, release and FIFO-tail requeue. Only idle private environments may be stopped; data is retained.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1625"/><stop offset="1" stop-color="#101f30"/></linearGradient>
 <linearGradient id="accent"><stop stop-color="#7ee5d5"/><stop offset="1" stop-color="#72b8ff"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182a3b"/><stop offset="1" stop-color="#142337"/></linearGradient>
 <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#32465b" opacity=".28"/></pattern>
 <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%"><feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#000" flood-opacity=".20"/></filter>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#71cfc7" stroke-width="1.6"/></marker>
 <marker id="muted-arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#859bb0" stroke-width="1.6"/></marker>
 <style>text{font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.mono{font-family:'SFMono-Regular',Menlo,Consolas,monospace}</style>
</defs>
<rect width="2048" height="2048" fill="url(#bg)"/><g transform="translate(104 0)"><rect width="1840" height="2048" fill="url(#dots)"/>

<rect x="60" y="52" width="300" height="34" rx="17" fill="#173d40" stroke="none" stroke-width="1.4"/>
<text x="210.0" y="75" font-size="16" fill="#7ee5d5" font-weight="600" text-anchor="middle">CODEX SKILL  /  macOS  /  v2</text>
<text x="60" y="151" font-size="62" fill="#f4f8fc" font-weight="750">simulator-manager</text>
<text x="60" y="195" font-size="28" fill="#a5bace" font-weight="400">Your session. Your simulator. A fair share of the Mac.</text>
<rect x="60" y="236" width="1720" height="128" rx="24" fill="#152d3b" stroke="#3c6874" stroke-width="1.4" filter="url(#shadow)"/>
<text x="90" y="273" font-size="16" fill="#7ee5d5" font-weight="750">ENABLE EACH SESSION · INSTALL ONCE</text>
<text x="90" y="314" font-size="28" fill="#f4f8fc" font-weight="650">Use the simulator-manager Skill + GitHub link. Enable shared mode.</text>
<text x="90" y="346" font-size="19" fill="#87b7db" font-weight="400" class="mono">github.com/HankHuang0516/simulator-manager</text>
<rect x="450" y="400" width="980" height="110" rx="20" fill="url(#panel)" stroke="#7ee5d5" stroke-width="1.4" filter="url(#shadow)"/>
<text x="478" y="442" font-size="25" fill="#f4f8fc" font-weight="650">Build &amp; host unit tests first</text>
<text x="478" y="482" font-size="19" fill="#a5bdd1" font-weight="400">Acquire only for runtime, UI, device-dependent XCTest or instrumentation.</text>
<path d="M940 364 V386" fill="none" stroke="#71cfc7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M940 510 V542" fill="none" stroke="#71cfc7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M940 542 L1120 593 L940 644 L760 593 Z" fill="#302c25" stroke="#d6b573" stroke-width="1.8"/>
<text x="940" y="601" font-size="23" fill="#f8dfad" font-weight="650" text-anchor="middle">Runtime required?</text>
<rect x="60" y="536" width="340" height="115" rx="20" fill="url(#panel)" stroke="#859bb0" stroke-width="1.4" filter="url(#shadow)"/>
<text x="88" y="578" font-size="25" fill="#f4f8fc" font-weight="650">Host checks complete</text>
<text x="88" y="618" font-size="19" fill="#a5bdd1" font-weight="400">No simulator occupancy.</text>
<path d="M760 593 H416" fill="none" stroke="#859bb0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted-arrow)"/>
<rect x="500" y="562" width="65" height="34" rx="17" fill="#26384b" stroke="none" stroke-width="1.4"/>
<text x="532.5" y="585" font-size="15" fill="#b5c4d2" font-weight="600" text-anchor="middle">NO</text>
<path d="M940 644 V681" fill="none" stroke="#71cfc7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="978" y="652" width="65" height="34" rx="17" fill="#173d40" stroke="none" stroke-width="1.4"/>
<text x="1010.5" y="675" font-size="15" fill="#7ee5d5" font-weight="600" text-anchor="middle">YES</text>
<rect x="450" y="694" width="980" height="110" rx="20" fill="url(#panel)" stroke="#7ee5d5" stroke-width="1.4" filter="url(#shadow)"/>
<text x="478" y="736" font-size="25" fill="#f4f8fc" font-weight="650">FIFO admission → lease grant</text>
<text x="478" y="776" font-size="19" fill="#a5bdd1" font-weight="400">Wait without occupying a device. Start the total clock only after grant.</text>
<path d="M940 804 V832 H685 V851" fill="none" stroke="#71cfc7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M940 832 H1195 V851" fill="none" stroke="#71cfc7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="450" y="865" width="470" height="184" rx="20" fill="url(#panel)" stroke="#7ee5d5" stroke-width="1.4" filter="url(#shadow)"/>
<text x="478" y="907" font-size="25" fill="#f4f8fc" font-weight="650">Dynamic Simulator Pool</text>
<text x="478" y="947" font-size="19" fill="#a5bdd1" font-weight="400">DEFAULT · up to 3 budget units</text>
<text x="478" y="977" font-size="19" fill="#a5bdd1" font-weight="400">Fixed device per session + project</text>
<text x="478" y="1007" font-size="19" fill="#a5bdd1" font-weight="400">Unique iOS UDID / writable Android AVD</text>
<text x="478" y="1037" font-size="19" fill="#a5bdd1" font-weight="400">Reserve capacity before parallel creation.</text>
<rect x="960" y="865" width="470" height="184" rx="20" fill="url(#panel)" stroke="#d6b573" stroke-width="1.4" filter="url(#shadow)"/>
<text x="988" y="907" font-size="25" fill="#f4f8fc" font-weight="650">Traditional Mode</text>
<text x="988" y="947" font-size="19" fill="#a5bdd1" font-weight="400">Original shared-pool FIFO scheduling</text>
<text x="988" y="977" font-size="19" fill="#a5bdd1" font-weight="400">Configured shared budget · default 1</text>
<text x="988" y="1007" font-size="19" fill="#a5bdd1" font-weight="400">Reuse private devices serially, or fallback</text>
<text x="988" y="1037" font-size="19" fill="#a5bdd1" font-weight="400">Never lend another session’s private VM.</text>
<path d="M685 1049 V1071 H940" fill="none" stroke="#71cfc7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1195 1049 V1071 H940" fill="none" stroke="#71cfc7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M940 1071 V1091" fill="none" stroke="#71cfc7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="450" y="1105" width="980" height="159" rx="20" fill="url(#panel)" stroke="#7ee5d5" stroke-width="1.4" filter="url(#shadow)"/>
<text x="478" y="1147" font-size="25" fill="#f4f8fc" font-weight="650">Create · boot assigned device · validate</text>
<text x="478" y="1187" font-size="19" fill="#a5bdd1" font-weight="400">One clock includes ALL phases. Renewals never move the hard deadline.</text>
<text x="478" y="1217" font-size="19" fill="#a5bdd1" font-weight="400">Use explicit UDID / adb serial. Track the owned workload group.</text>
<text x="478" y="1247" font-size="19" fill="#a5bdd1" font-weight="400">Visible desktop automation: --foreground serializes GUI access.</text>
<path d="M940 1264 V1301" fill="none" stroke="#71cfc7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="450" y="1315" width="980" height="153" rx="20" fill="url(#panel)" stroke="#d6b573" stroke-width="1.4" filter="url(#shadow)"/>
<text x="478" y="1357" font-size="25" fill="#f4f8fc" font-weight="650">Someone waiting? Finish or checkpoint your chunk.</text>
<text x="478" y="1397" font-size="19" fill="#a5bdd1" font-weight="400">Yield at the 120-second slice; a late waiter gets a 10-second checkpoint window.</text>
<text x="478" y="1427" font-size="19" fill="#a5bdd1" font-weight="400">Signal only your owned work, wait for it to exit, then release.</text>
<text x="478" y="1457" font-size="19" fill="#a5bdd1" font-weight="400">Exit 75 → remaining work needs a fresh FIFO-tail request.</text>
<path d="M940 1468 V1505" fill="none" stroke="#71cfc7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="450" y="1519" width="980" height="125" rx="20" fill="url(#panel)" stroke="#7ee5d5" stroke-width="1.4" filter="url(#shadow)"/>
<text x="478" y="1561" font-size="25" fill="#f4f8fc" font-weight="650">Release on completion, failure, interruption or timeout</text>
<text x="478" y="1601" font-size="19" fill="#a5bdd1" font-weight="400">Use rights end; session data remains. Never transfer a live workload.</text>
<text x="478" y="1631" font-size="19" fill="#a5bdd1" font-weight="400">Idle private VMs may be stopped safely by the manager, without erasing data.</text>
<path d="M940 1644 V1684" fill="none" stroke="#71cfc7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="450" y="1698" width="980" height="84" rx="19" fill="#143e3c" stroke="#58b8a9" stroke-width="1.4" filter="url(#shadow)"/>
<text x="940" y="1751" font-size="26" fill="#b6f0e2" font-weight="650" text-anchor="middle">Next waiter proceeds · Remaining work rejoins at the tail</text>
<path d="M1430 1740 H1452 V748 H1434" fill="none" stroke="#859bb0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#muted-arrow)"/>
<rect x="60" y="780" width="340" height="750" rx="20" fill="#142335" stroke="#416578" stroke-width="1.4" filter="url(#shadow)"/>
<text x="87" y="824" font-size="16" fill="#87b7db" font-weight="750">PERFORMANCE WATCHER</text>
<text x="87" y="868" font-size="22" fill="#eef5fa" font-weight="650">Monitor the shared Mac</text>
<text x="87" y="910" font-size="16" fill="#aac0d0" font-weight="400">Available memory · normalized load</text>
<text x="87" y="940" font-size="16" fill="#aac0d0" font-weight="400">Free disk · 2-second sampling</text>
<text x="87" y="970" font-size="16" fill="#aac0d0" font-weight="400">3 bad samples → one stage down</text>
<rect x="87" y="1010" width="282" height="34" rx="17" fill="#173d40" stroke="none" stroke-width="1.4"/>
<text x="228.0" y="1033" font-size="16" fill="#7ee5d5" font-weight="600" text-anchor="middle">1  DYNAMIC</text>
<rect x="87" y="1100" width="282" height="34" rx="17" fill="#223b58" stroke="none" stroke-width="1.4"/>
<text x="228.0" y="1123" font-size="16" fill="#91caff" font-weight="600" text-anchor="middle">2  CONSTRAINED</text>
<rect x="87" y="1190" width="282" height="34" rx="17" fill="#3c3528" stroke="none" stroke-width="1.4"/>
<text x="228.0" y="1213" font-size="16" fill="#f1cf8d" font-weight="600" text-anchor="middle">3  DRAINING</text>
<rect x="87" y="1280" width="282" height="34" rx="17" fill="#3c3528" stroke="none" stroke-width="1.4"/>
<text x="228.0" y="1303" font-size="16" fill="#f1cf8d" font-weight="600" text-anchor="middle">4  TRADITIONAL</text>
<text x="87" y="1068" font-size="16" fill="#b8c8d8" font-weight="400">Create + reuse private environments</text>
<text x="87" y="1158" font-size="16" fill="#b8c8d8" font-weight="400">Pause new private creation</text>
<text x="87" y="1248" font-size="16" fill="#b8c8d8" font-weight="400">Reduce admission; let active work finish</text>
<text x="87" y="1338" font-size="16" fill="#b8c8d8" font-weight="400">Serialize reuse + configured fallback</text>
<text x="87" y="1400" font-size="18" fill="#9de5d2" font-weight="650">Recovery: 10 healthy samples</text>
<text x="87" y="1433" font-size="16" fill="#aac0d0" font-weight="400">per upward stage. No rapid flapping.</text>
<text x="87" y="1485" font-size="18" fill="#f8dfad" font-weight="650">Never evict an active session.</text>
<rect x="1480" y="780" width="300" height="750" rx="20" fill="#202936" stroke="#647181" stroke-width="1.4" filter="url(#shadow)"/>
<text x="1505" y="824" font-size="16" fill="#e9c283" font-weight="750">OCCUPANCY POLICY</text>
<text x="1505" y="881" font-size="25" fill="#f8dfad" font-weight="650">600 seconds total</text>
<text x="1505" y="916" font-size="17" fill="#b8c8d8" font-weight="400">Creation + boot + validation</text>
<text x="1505" y="983" font-size="23" fill="#f8dfad" font-weight="650">3 renewal extensions</text>
<text x="1505" y="1018" font-size="17" fill="#b8c8d8" font-weight="400">Never extend the hard limit.</text>
<text x="1505" y="1088" font-size="23" fill="#f8dfad" font-weight="650">Safe yielding</text>
<text x="1505" y="1123" font-size="17" fill="#b8c8d8" font-weight="400">Checkpoint → stop own work</text>
<text x="1505" y="1153" font-size="17" fill="#b8c8d8" font-weight="400">→ release → requeue at tail</text>
<text x="1505" y="1220" font-size="17" fill="#9de5d2" font-weight="650">Automatic rerun only for</text>
<text x="1505" y="1250" font-size="16" fill="#9de5d2" font-weight="400">explicitly restartable commands.</text>
<text x="1505" y="1320" font-size="23" fill="#eef5fa" font-weight="650">Crash protection</text>
<text x="1505" y="1355" font-size="16" fill="#b8c8d8" font-weight="400">Watchdog cancels tracked orphan</text>
<text x="1505" y="1385" font-size="16" fill="#b8c8d8" font-weight="400">groups at their original deadline.</text>
<text x="1505" y="1448" font-size="17" fill="#f8dfad" font-weight="400">Unknown live manual work</text>
<text x="1505" y="1478" font-size="17" fill="#f8dfad" font-weight="400">stays protected. Prefer run.</text>
<rect x="60" y="1840" width="1720" height="118" rx="22" fill="#132b36" stroke="#3c6874" stroke-width="1.4"/>
<text x="90" y="1882" font-size="17" fill="#7ee5d5" font-weight="750">ONE SHARED STATE · COOPERATIVE COORDINATION</text>
<text x="90" y="1919" font-size="22" fill="#c3d5e4" font-weight="400">Separate device data, shared host/SDK/desktop. Exact-device commands only. No shutdown-all, erase-all or adb kill-server.</text>
<text x="60" y="2010" font-size="16" fill="#87a4ba" font-weight="650">PRIVATE ENVIRONMENT ≠ PERMANENT OCCUPANCY</text>
<text x="1780" y="2010" font-size="17" fill="#91a8bd" font-weight="400" text-anchor="end">Same Mac account · Same state · Every session follows the Skill</text>
</g></svg>