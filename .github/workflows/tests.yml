name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Validate shell entry points
        run: sh -n install.sh bootstrap.sh
      - name: Compile Python sources
        run: python -m compileall -q sim_manager tests install.py activate.py
      - name: Test activation, resource exclusion, queues, and SDK adapters
        run: python -m unittest discover -s tests -v
      - name: Compile native floating dashboard
        if: runner.os == 'macOS'
        run: python bin/sim-manager ui --build-only --json
